<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="150" y1="40" x2="850" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24213d"/>
      <stop offset="0.52" stop-color="#141526"/>
      <stop offset="1" stop-color="#0c0e19"/>
    </linearGradient>
    <linearGradient id="wave" x1="270" y1="420" x2="754" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4b5fd"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 470 -470 0 512 512)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.17"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#background)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="227" fill="none" stroke="url(#edge)" stroke-width="10"/>

  <!-- Open loop and arrow suggest a repeating practice cycle. -->
  <path d="M 695 233 A 330 330 0 1 1 789 674" fill="none" stroke="#a78bfa" stroke-opacity="0.34" stroke-width="18" stroke-linecap="round"/>
  <path d="M 692 179 L 711 250 L 778 219" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Five clear waveform bars remain legible at small launcher sizes. -->
  <g fill="url(#wave)">
    <rect x="299" y="429" width="54" height="166" rx="27"/>
    <rect x="398" y="354" width="54" height="316" rx="27"/>
    <rect x="485" y="278" width="54" height="468" rx="27"/>
    <rect x="572" y="354" width="54" height="316" rx="27"/>
    <rect x="671" y="429" width="54" height="166" rx="27"/>
  </g>
</svg>
